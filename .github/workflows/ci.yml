name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          # The rollback contract test loads the validator from a pinned old commit.
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false

      - name: Run built-in Node tests
        run: npm test

      - name: Check JavaScript syntax
        run: npm run check

      - name: Inspect package contents
        run: npm pack --dry-run --ignore-scripts --offline

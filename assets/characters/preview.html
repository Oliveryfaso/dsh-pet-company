<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>陪伴 · 社区角色预览</title><style>*{box-sizing:border-box}body{margin:0;padding:40px 24px;background:#f4f1ea;color:#35424a;font:15px/1.6 system-ui,sans-serif}main{max-width:1160px;margin:auto}h1{font-size:30px;letter-spacing:-.04em;font-weight:650;margin:0 0 6px}header p{color:#747d7e;margin:0 0 28px}.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}article{border:1px solid #dfdfd8;border-radius:24px;background:#fffcf7;overflow:hidden}video{display:block;width:100%;height:auto;aspect-ratio:16/9;background-image:linear-gradient(45deg,#e5e8e366 25%,transparent 25%),linear-gradient(-45deg,#e5e8e366 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#e5e8e366 75%),linear-gradient(-45deg,transparent 75%,#e5e8e366 75%);background-size:20px 20px;background-position:0 0,0 10px,10px -10px,-10px 0}.details{padding:16px 22px 24px}h2{font-size:19px;margin:0 0 4px}.tagline{font-size:13px;color:#73817f;margin:0 0 18px}label{display:block;font-size:12px;color:#6f7b7d;margin-bottom:5px}select{font:inherit;font-size:13px;width:100%;padding:8px 10px;border:1px solid #cbd5d2;border-radius:8px;color:#35424a;background:#fffdf8}select:focus-visible{outline:3px solid #a9c5c0;outline-offset:2px}.play{font:inherit;font-size:13px;border:1px solid #b9ceca;border-radius:8px;background:#e7f1ed;color:#365d53;min-height:37px;width:100%;margin-top:10px;cursor:pointer}.play:focus-visible{outline:3px solid #a9c5c0;outline-offset:2px}.note{padding:15px 18px;border:1px solid #d9e1dd;border-radius:12px;background:#edf4f0;color:#586f68;font-size:13px;margin-top:22px}.credits{font-size:12px;color:#7c817e;margin-top:25px}.credits a{color:inherit}@media(max-width:720px){body{padding:25px 16px}.cards{grid-template-columns:1fr}video{max-height:340px}h1{font-size:26px}}</style><main><header><h1>今天也有人惦记你。</h1><p>三个社区小伙伴，继续陪你慢慢把代码写好。</p></header><div class="cards" id="cards"></div><p class="note">橙发按你的选择，用正常比例的阅读动作待机。原始待机、跳跃和失败动作仍保留，切换预览即可查看。</p><p class="credits">美术：<a href="https://github.com/fywdy/chatgpt-chibi-pets">fywdy/chatgpt-chibi-pets</a>，<a href="https://creativecommons.org/licenses/by-nc/4.0/">CC BY-NC 4.0（非商用）</a>。均为非官方同人，与相关品牌无关联。上游工具许可与美术许可分开保留。</p></main><script>
const profiles=[{kind:'silver',name:'银白龙娘',text:'银白长发、小角和龙尾',initial:'idle'},{kind:'orange',name:'橙书娘',text:'捧好书，也记得关心自己',initial:'review'},{kind:'tide',name:'蓝鲸女仆',text:'轻轻冒个泡，陪你收工',initial:'idle'}];
const names={idle:'原始待机', 'running-right':'向右跑原图', 'running-left':'向左跑原图',waving:'挥手',jumping:'跳跃',failed:'失败反应',waiting:'等待输入',running:'工作中',review:'阅读 / 检查',care:'关怀（橙发沿用阅读姿态）'};
const root=document.querySelector('#cards');
for(const p of profiles){const card=document.createElement('article');card.innerHTML=`<video loop muted playsinline preload="none" poster="${p.kind}-${p.initial}.png" src="../../pet/companion-${p.kind}-animation/${p.initial}.webm" aria-label="${p.name}动作预览"></video><div class="details"><h2>${p.name}</h2><p class="tagline">${p.text}</p><label for="action-${p.kind}">动作预览</label><select id="action-${p.kind}">${Object.entries(names).map(([v,label])=>`<option value="${v}" ${v===p.initial?'selected':''}>${label}</option>`).join('')}</select><button type="button" class="play">播放动作</button></div>`;const video=card.querySelector('video');const play=card.querySelector('.play');play.onclick=()=>{if(video.paused){video.play().catch(()=>{play.textContent='当前浏览器无法播放'})}else video.pause()};video.onpause=()=>{play.textContent='播放动作'};card.querySelector('select').onchange=e=>{video.pause();const action=e.target.value;video.poster=`${p.kind}-${action==='care'?(p.kind==='orange'?'review':'waving'):action}.png`;video.src=`../../pet/companion-${p.kind}-animation/${action}.webm`;video.load();};video.onplay=()=>{play.textContent='暂停动作';document.querySelectorAll('video').forEach(other=>{if(other!==video)other.pause()})};root.append(card);}
</script></html>
